seed: 42
dry_run: false
validate_only: false

eos:
  type: metamodel_cse
  ndat_metamodel: 100
  nmax_nsat: 25.0
  nb_CSE: 8
  crust_name: DH

tov:
  type: gr
  min_nsat_TOV: 0.75
  ndat_TOV: 100
  nb_masses: 100

prior:
  specification_file: prior.prior

likelihoods:
  - type: constraints_eos
    enabled: true
  - type: gw_fisher
    enabled: true
    gwfast_result_file: ./gwfast_result.h5
    injection_catalog_file: ./injection_catalog.h5
    snr_threshold: 0.0
    q_min: 0.5
    q_max: 1.0
    dq: 0.01

sampler:
  type: smc-rw
  n_particles: 200
  n_mcmc_steps: 10
  target_ess: 0.9
  random_walk_sigma: 0.1
  output_dir: ./outdir/

postprocessing:
  enabled: true
  make_cornerplot: false
  make_massradius: true
  make_pressuredensity: true
