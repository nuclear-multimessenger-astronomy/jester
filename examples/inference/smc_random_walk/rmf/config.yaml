seed: 43
dry_run: false
validate_only: false

eos:
  type: rmf
  crust_name: Tolos

tov:
  min_nsat_TOV: 0.75
  ndat_TOV: 100
  nb_masses: 100
  type: gr

prior:
  specification_file: prior.prior

# Prior-only sampling: no observational likelihoods, just the EOS physical-validity
# constraints (causality, monotonicity, stability). Per project convention, this is the
# first end-to-end check before wiring up real observational likelihoods -- confirms the
# RMF EOS is fully pluggable through JesterTransform and the smc-rw sampler.
likelihoods:
- type: constraints_eos
  enabled: true
- type: zero
  enabled: true

sampler:
  type: smc-rw
  n_particles: 2000
  n_mcmc_steps: 10
  target_ess: 0.9
  random_walk_sigma: 0.1
  output_dir: ./outdir/

postprocessing:
  plot_format: "png"
  enabled: true
  make_cornerplot: false
  make_massradius: true
  make_pressuredensity: true
